version: 2

updates:
  # Python dependencies tracked by uv. Dependabot reads `pyproject.toml`
  # and `uv.lock` directly via the `uv` package-ecosystem (Dependabot
  # supports uv as of 2024-Q4). Group all minor/patch bumps into a
  # single PR per week to reduce noise on a research repo.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Treat torch / torchvision as critical and unpin major bumps so we
    # do not silently slide off the cu128 ABI.
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in `.github/workflows/`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
