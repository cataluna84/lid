model: CohereLabs/tiny-aya-global
dataset: 1024m/LID
dataset_file: Data_Hackathon/LID-500.parquet
sample_frac: 0.1
random_state: 1024

training:
  epochs: 5
  batch_size: 8
  lr: 1.0e-4
  warmup_steps: 50
  max_length: 512
  grad_accum: 2
  val_split: 0.1
  use_lora: true
  lora_r: 16
  lora_alpha: 32

inference:
  batch_size: 16
  temperature: 0.2
  max_length: 512

quantization: 4bit
