[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lid"
version = "0.1.0"
description = "Layer-wise dynamics of multilingual language identification (67 languages) in compact foundation models — training, layer-wise inference, optimization-strategy benchmarks, and analysis."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12.13,<3.13"
authors = [
    { name = "Mayank Bhaskar", email = "mayankbhaskar007@gmail.com" },
]
keywords = [
    "language-identification",
    "multilingual",
    "mechanistic-interpretability",
    "transformer",
    "benchmark",
    "quantization",
    "torch-compile",
    "flash-attention",
    "NLP",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.11.0",
    "transformers>=5.9.0",
    "datasets>=4.8.5",
    "huggingface-hub>=1.16.1",
    "tokenizers>=0.22.0",
    "safetensors>=0.7.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "matplotlib>=3.9",
    "tqdm>=4.67",
    "peft>=0.19.1",
    "accelerate>=1.5.0",
    "bitsandbytes>=0.45.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "unicodeblock>=0.3.0",
    "wandb>=0.19.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
]
cu128 = [
    "torch>=2.11.0",
]
unsloth = [
    "unsloth",
    "unsloth_zoo",
    "sentencepiece",
    "protobuf",
    "hf_transfer",
    "xformers",
    "trl",
    "torchvision",
]

[project.urls]
Homepage      = "https://github.com/cataluna84/lid"
Repository    = "https://github.com/cataluna84/lid"
Issues        = "https://github.com/cataluna84/lid/issues"
Changelog     = "https://github.com/cataluna84/lid/blob/main/CHANGELOG.md"
Documentation = "https://github.com/cataluna84/lid/tree/main/docs"

[project.scripts]
lid-train = "lid.train:main"
lid-infer = "lid.infer:main"
lid-visualize = "lid.visualize:main"
lid-bench = "lid.bench.runner:main"
lid-upload = "lid.upload:main"
lid-report = "lid.report:main"
lid-recommend = "lid.recommend:main"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.6.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "nbstripout>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/lid"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Notebooks under notebooks/ are exploratory and not on the lint-clean
# path. Their conventions (cell-output magics, ad-hoc names, in-cell
# imports) are intentionally permissive; nbstripout still strips outputs
# at commit time. ruff 0.5+ began linting .ipynb by default, so we opt
# out here so both `make lint` and `pre-commit run -a` stay green.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lid"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# transformers + torch.compile + wandb upstream type stubs are noisy
# (e.g. AutoModelForCausalLM.from_pretrained is typed as accepting a model
# instance, not a model id string). Suppress import-level noise so our
# in-repo type errors stay visible.
[[tool.mypy.overrides]]
module = ["transformers.*", "wandb.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/lid --cov-report=term-missing"
