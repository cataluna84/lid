[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lid"
version = "0.1.0"
description = "Layer-Wise Dynamics of Multilingual Language Identification in Compact Foundation Models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12.13,<3.13"
authors = [
    { name = "Mayank Bhaskar", email = "mayankbhaskar007@gmail.com" },
]
keywords = [
    "language-identification",
    "multilingual",
    "mechanistic-interpretability",
    "transformer",
    "NLP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.11.0",
    "transformers>=5.0.0",
    "datasets>=4.0.0",
    "huggingface-hub>=1.7.0",
    "tokenizers>=0.22.0",
    "safetensors>=0.7.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tqdm>=4.67",
    "peft>=0.14.0",
    "accelerate>=1.5.0",
    "bitsandbytes>=0.45.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "unicodeblock>=0.3.0",
    "wandb>=0.19.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
]
cu128 = [
    "torch>=2.11.0",
]
unsloth = [
    "unsloth",
    "unsloth_zoo",
    "sentencepiece",
    "protobuf",
    "hf_transfer",
    "xformers",
    "trl",
    "torchvision",
]

[project.scripts]
lid-train = "lid.train:main"
lid-infer = "lid.infer:main"
lid-visualize = "lid.visualize:main"
lid-bench = "lid.bench.runner:main"
lid-upload = "lid.upload:main"
lid-report = "lid.report:main"
lid-recommend = "lid.recommend:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "nbstripout>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/lid"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lid"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/lid --cov-report=term-missing"
