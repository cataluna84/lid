[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lid"
version = "0.1.0"
description = "Layer-Wise Dynamics of Multilingual Language Identification in Compact Foundation Models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Mayank Bhaskar", email = "mayankbhaskar007@gmail.com" },
]
keywords = [
    "language-identification",
    "multilingual",
    "mechanistic-interpretability",
    "transformer",
    "NLP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.20.0",
    "tokenizers>=0.22.0",
    "safetensors>=0.4.3",
    "numpy>=1.17",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "peft>=0.10.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.0.0",
]
cu124 = [
    "torch>=2.0.0",
]

[project.scripts]
lid-train = "lid.train:main"
lid-infer = "lid.infer:main"
lid-visualize = "lid.visualize:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "nbstripout>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/lid"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lid"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/lid --cov-report=term-missing"
